# Проверка при каждой отправке: типы, сценарий (симулятор прохождений), структура текста, сборка.
name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Симулятор сценария (1500 прохождений на политику)
        run: node tests/story-sim.mjs 1500
      - name: Сборка
        run: npm run build
      - name: Готовая веб-версия
        uses: actions/upload-artifact@v4
        with:
          name: afterimage-web
          path: dist/index.html
          retention-days: 30

  browser:
    # браузерные тесты: интерфейс на 4 разрешениях, функции, регрессии, точки осмотра, сквозное прохождение
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tests/review.mjs
      - run: node tests/features.mjs
      - run: node tests/ui.mjs
      - run: node tests/hotspots.mjs
      - run: node tests/voice.mjs
      - run: node tests/e2e.mjs kind
      - name: Скриншоты при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/out/
