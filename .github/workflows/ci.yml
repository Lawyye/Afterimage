# Проверка при каждой отправке: типы, сценарий (симулятор прохождений), структура текста, сборка.
name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Симулятор сценария (1500 прохождений на политику)
        run: node tests/story-sim.mjs 1500
      - name: Сборка
        run: npm run build
