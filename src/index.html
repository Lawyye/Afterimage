<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>Послеобраз</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="world">
      <div id="bg-layer"></div>
      <div id="char-layer"></div>
      <div id="hotspot-layer"></div>
      <canvas id="weather" width="1920" height="1080"></canvas>
      <div id="memory-tint"></div>
    </div>
    <div id="letterbox"><div class="bar top"></div><div class="bar bottom"></div></div>
    <div id="ui"></div>
    <div id="overlay"></div>
    <div id="post">
      <canvas id="noise" width="320" height="180"></canvas>
      <div id="scanlines"></div>
      <div id="vignette"></div>
      <canvas id="glitch" width="960" height="540"></canvas>
      <div id="flash"></div>
      <div id="fade"></div>
    </div>
  </div>
  <div id="rotate-hint">Поверните устройство горизонтально</div>
</div>
<noscript>Для игры нужен JavaScript.</noscript>
<script>/*__JS__*/</script>
</body>
</html>
